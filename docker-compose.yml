services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: carebodha
      POSTGRES_PASSWORD: carebodha_local
      POSTGRES_DB: carebodha
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - carebodha_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carebodha -d carebodha"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  carebodha_pg:
